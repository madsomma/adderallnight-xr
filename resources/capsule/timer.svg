<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- Timer state at 50%: the bead half is full (beads knocked out), the other half is empty. -->
  <defs>
    <clipPath id="body"><rect x="-8.75" y="-4.75" width="17.5" height="9.5" rx="4.75"/></clipPath>
    <mask id="beads">
      <rect x="-10" y="-10" width="20" height="20" fill="#fff"/>
      <circle cx="-4.9" cy="1" r="1" fill="#000"/>
      <circle cx="-2.5" cy="-1.3" r="1" fill="#000"/>
      <circle cx="-2.3" cy="1.5" r="1" fill="#000"/>
    </mask>
  </defs>
  <g transform="rotate(-45 9 9) translate(9 9)">
    <g clip-path="url(#body)"><rect x="-9" y="-5" width="9" height="10" fill="#000000" mask="url(#beads)"/></g>
    <rect x="-8" y="-4" width="16" height="8" rx="4" fill="none" stroke="#000000" stroke-width="1.5"/>
  </g>
</svg>
